<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pesquisa de Satisfação | Cosmos 3D</title><style>:root{--blue:#4b91e8;--ink:#303437;--muted:#777b7f;--line:#e3e5e6;--bg:#f4f4f3}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}.page{width:min(100%,620px);min-height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column}.head{padding:20px 20px 13px;border-bottom:1px solid #efefee}.logo{display:block;width:min(360px,88vw);height:auto;margin:0 auto 18px}.status{display:flex;align-items:center;gap:13px}.track{height:3px;background:#eceeed;flex:1;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:var(--blue);transition:.3s}.progress{font-size:12px;color:var(--muted);white-space:nowrap}.main{flex:1;padding:38px 20px 32px}.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:15px}h1,h2{margin:0;letter-spacing:-.035em}h1{font-size:clamp(34px,10vw,46px);line-height:1.03}h2{font-size:clamp(27px,7.6vw,37px);line-height:1.1}.lead{color:var(--muted);font-size:16px;line-height:1.55;margin:19px 0 0}.meta{font-size:12px;color:#999;margin-top:17px}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:34px}.btn{border:0;border-radius:7px;color:#fff;padding:15px 19px;font-size:15px;font-weight:700;cursor:pointer;min-height:50px;background:var(--blue)}.back{background:transparent;color:var(--muted);padding-left:0}input,textarea{width:100%;font:inherit;font-size:18px;border:1px solid var(--line);border-radius:7px;padding:16px;outline:0;background:#fff;margin-top:25px}input:focus,textarea:focus{border-color:var(--blue)}textarea{min-height:145px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:29px}.score{height:54px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}.score.selected{background:var(--blue);border-color:var(--blue);color:#fff}.anchors{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:10px}.na{margin-top:19px}.na button{width:100%;background:#fff;border:1px solid var(--line);border-radius:7px;padding:14px;color:var(--muted);font-weight:600}.check{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:23px;margin-bottom:21px}.error{color:#a33;font-size:12px;margin-top:9px}@media(min-width:641px){body{padding:28px}.page{min-height:calc(100dvh - 56px);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:27px 40px 15px}.main{padding:50px 40px}.scale{grid-template-columns:repeat(10,1fr)}.scale.nps{grid-template-columns:repeat(11,1fr)}}</style></head><body><div class="page"><header class="head"><img class="logo" alt="Cosmos 3D" src="WhatsApp%20Image%202026-08-06%20at%2009.29.53.jpeg"><div class="status"><div class="track"><div class="bar" id="bar"></div></div><div class="progress" id="progress"></div></div></header><main class="main"><section id="app"></section></main></div><script>const qs=[{k:'projeto',t:'text',q:'Qual projeto ou obra você realizou com a Cosmos 3D?'},{k:'atendimento',t:'scale',q:'Como você avalia o atendimento e a disponibilidade da nossa equipe?'},{k:'comunicacao',t:'scale',q:'Como você avalia a clareza e a agilidade da nossa comunicação?'},{k:'prazos',t:'scale',q:'Como você avalia o cumprimento dos prazos e compromissos acordados?',na:1},{k:'qualidade',t:'scale',q:'Como você avalia a qualidade dos serviços executados pela Cosmos 3D?',na:1},{k:'resultado',t:'scale',q:'O resultado entregue pela Cosmos 3D atendeu ao que foi contratado e às suas expectativas?',na:1,a:['Não atendeu','Superou as expectativas']},{k:'satisfacao',t:'scale',q:'De modo geral, qual é o seu nível de satisfação com a Cosmos 3D?',a:['Muito insatisfeito','Muito satisfeito']},{k:'nps',t:'nps',q:'De 0 a 10, qual a probabilidade de você recomendar a Cosmos 3D para outra pessoa ou empresa?',a:['Nada provável','Extremamente provável']},{k:'comentario',t:'comment',q:'Há algo que poderíamos fazer para melhorar sua experiência com a Cosmos 3D? Se quiser, deixe também sugestões ou comentários.',opt:1}];let step=-1,d={};const app=document.getElementById('app'),bar=document.getElementById('bar'),pg=document.getElementById('progress');function render(){scrollTo(0,0);if(step<0){bar.style.width='0';pg.textContent='';app.innerHTML='<div class="eyebrow">Pesquisa de satisfação</div><h1>Sua opinião é importante para nós.</h1><p class="lead">Queremos conhecer sua experiência com a Cosmos 3D e identificar oportunidades para melhorar continuamente nossos serviços.</p><p class="meta">Leva cerca de 1 minuto.</p><div class="actions"><span></span><button class="btn" onclick="next()">Começar →</button></div>';return}if(step>=qs.length){bar.style.width='100%';pg.textContent='Concluído';app.innerHTML='<div class="check">✓</div><div class="eyebrow">Pesquisa concluída</div><h2>Obrigado pela sua avaliação.</h2><p class="lead">Sua opinião é muito importante para a melhoria contínua dos nossos serviços.</p>';return}let x=qs[step];pg.textContent=(step+1)+' de '+qs.length;bar.style.width=((step+1)/qs.length*100)+'%';let body='';if(x.t==='text')body='<input id="field" type="text" placeholder="Nome do projeto ou obra" value="'+(d[x.k]||'')+'"><div id="err"></div>';if(x.t==='comment')body='<textarea id="field" placeholder="Escreva aqui...">'+(d[x.k]||'')+'</textarea>';if(x.t==='scale'||x.t==='nps'){let s=x.t==='nps'?0:1;body='<div class="scale '+(x.t==='nps'?'nps':'')+'>'+Array.from({length:11-s},(_,i)=>i+s).map(n=>'<button class="score '+(d[x.k]===n?'selected':'')+'" onclick="pick('+n+')">'+n+'</button>').join('')+'</div><div class="anchors"><span>'+(x.a?x.a[0]:'Péssimo')+'</span><span>'+(x.a?x.a[1]:'Excelente')+'</span></div>'+(x.na?'<div class="na"><button onclick="pickNA()">Não se aplica</button></div>':'')}app.innerHTML='<div class="eyebrow">'+(x.opt?'Comentário opcional':'Sua avaliação')+'</div><h2>'+x.q+'</h2>'+body+'<div class="actions"><button class="btn back" onclick="back()">← Voltar</button><button class="btn" onclick="next()">'+(step===qs.length-1?'Enviar avaliação':'Continuar →')+'</button></div>'}function pick(v){d[qs[step].k]=v;render();setTimeout(next,160)}function pickNA(){d[qs[step].k]='N/A';render();setTimeout(next,160)}function next(){if(step>=0&&step<qs.length){let x=qs[step],f=document.getElementById('field');if(f)d[x.k]=f.value.trim();if(!x.opt&&(d[x.k]===undefined||d[x.k]==='')){let e=document.getElementById('err');if(e)e.innerHTML='<div class="error">Preencha este campo para continuar.</div>';if(f)f.focus();return}}step++;render()}function back(){if(step>-1)step--;render()}render();</script></body></html>
