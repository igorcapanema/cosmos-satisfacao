<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesquisa de Satisfação | Cosmos 3D</title>
<style>
:root{--electric:#1167ff;--blue:#0054d8;--ice:#eaf3ff;--ink:#101820;--muted:#66717b;--line:#dce3e8;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}body{background:#fff}.shell{min-height:100vh;display:grid;grid-template-columns:minmax(260px,34%) 1fr}.visual{position:relative;overflow:hidden;background:#071019;color:#fff;padding:42px;display:flex;flex-direction:column;justify-content:space-between}.visual:before{content:'';position:absolute;width:460px;height:460px;border:1px solid rgba(255,255,255,.14);border-radius:50%;left:-160px;top:16%}.visual:after{content:'';position:absolute;width:320px;height:320px;border:1px solid rgba(17,103,255,.75);border-radius:50%;left:-80px;top:27%;box-shadow:0 0 80px rgba(17,103,255,.25)}.brand{position:relative;z-index:2;font-weight:900;letter-spacing:.12em;font-size:19px}.brand b{color:#3d8cff}.sidecopy{position:relative;z-index:2}.sidecopy small{display:block;text-transform:uppercase;letter-spacing:.16em;color:#75aaff;font-weight:800;margin-bottom:14px}.sidecopy strong{font-size:clamp(26px,3vw,46px);line-height:1.03;letter-spacing:-.04em;display:block;max-width:430px}.sidefoot{position:relative;z-index:2;color:#8d99a5;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.content{min-height:100vh;display:flex;flex-direction:column}.header{padding:32px 7vw 0;display:flex;justify-content:flex-end}.progressText{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}.track{height:2px;background:#eef1f4;margin:18px 7vw 0}.bar{height:100%;background:var(--electric);width:0;transition:.35s ease}.main{flex:1;display:grid;place-items:center;padding:50px 7vw}.card{width:min(780px,100%)}.kicker{color:var(--electric);font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px}h1,h2{margin:0;letter-spacing:-.045em}h1{font-size:clamp(40px,6vw,72px);line-height:.98;max-width:720px}h2{font-size:clamp(29px,4vw,47px);line-height:1.08;max-width:760px}.lead{font-size:18px;line-height:1.65;color:var(--muted);max-width:650px;margin:25px 0 0}.accent{color:var(--electric)}.btn{border:0;background:var(--electric);color:#fff;padding:16px 22px;font-size:14px;font-weight:800;cursor:pointer;min-width:145px;transition:.2s}.btn:hover{transform:translateY(-1px);background:var(--blue)}.back{background:transparent;color:var(--muted);min-width:auto;padding-left:0}.back:hover{background:transparent;color:var(--ink);transform:none}.actions{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:38px}input[type=text],textarea{width:100%;font:inherit;font-size:20px;border:0;border-bottom:2px solid var(--line);padding:16px 0;outline:0;background:transparent;margin-top:12px}input:focus,textarea:focus{border-color:var(--electric)}textarea{min-height:160px;resize:vertical}.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:32px}.scale.nps{grid-template-columns:repeat(11,1fr)}.score{height:58px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:16px;cursor:pointer;transition:.16s}.score:hover,.score.selected{background:var(--electric);border-color:var(--electric);color:#fff;transform:translateY(-2px)}.anchors{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:11px}.na{margin-top:22px}.na button{background:#fff;border:1px solid var(--line);padding:11px 14px;color:var(--muted);font-weight:700;cursor:pointer}.na button.selected{border-color:var(--electric);color:var(--electric);background:var(--ice)}.success .check{width:56px;height:56px;background:var(--electric);color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:25px}.meta{margin-top:26px;color:#98a1a9;font-size:12px}.introline{width:72px;height:4px;background:var(--electric);margin:32px 0}.error{color:#b42318;font-size:13px;margin-top:10px}
@media(max-width:850px){.shell{display:block}.visual{min-height:auto;padding:22px 24px;background:#071019}.visual:before,.visual:after,.sidecopy,.sidefoot{display:none}.content{min-height:calc(100vh - 67px)}.header{padding:22px 24px 0}.track{margin:14px 24px 0}.main{padding:36px 24px 56px}.scale,.scale.nps{grid-template-columns:repeat(5,1fr)}.score{height:50px}h1{font-size:44px}.brand{font-size:16px}}
</style></head><body><div class="shell"><aside class="visual"><div class="brand">COSMOS <b>3D</b></div><div class="sidecopy"><small>Construção industrializada</small><strong>Precisão, tecnologia e evolução contínua.</strong></div><div class="sidefoot">Customer Experience · Brasil</div></aside><section class="content"><header class="header"><div class="progressText" id="progressText"></div></header><div class="track"><div class="bar" id="bar"></div></div><main class="main"><div class="card" id="app"></div></main></section></div>
<script>
const questions=[
{key:'projeto',type:'text',title:'Qual projeto ou obra você realizou com a Cosmos 3D?'},
{key:'atendimento',type:'scale',title:'Como você avalia o atendimento e a disponibilidade da nossa equipe?'},
{key:'comunicacao',type:'scale',title:'Como você avalia a clareza e a agilidade da nossa comunicação?'},
{key:'prazos',type:'scale',title:'Como você avalia o cumprimento dos prazos e compromissos acordados?',na:true},
{key:'qualidade',type:'scale',title:'Como você avalia a qualidade dos serviços executados pela Cosmos 3D?',na:true},
{key:'resultado',type:'scale',title:'O resultado entregue pela Cosmos 3D atendeu ao que foi contratado e às suas expectativas?',na:true,anchors:['Não atendeu','Superou as expectativas']},
{key:'satisfacao',type:'scale',title:'De modo geral, qual é o seu nível de satisfação com a Cosmos 3D?',anchors:['Muito insatisfeito','Muito satisfeito']},
{key:'nps',type:'nps',title:'De 0 a 10, qual a probabilidade de você recomendar a Cosmos 3D para outra pessoa ou empresa?',anchors:['Nada provável','Extremamente provável']},
{key:'comentario',type:'comment',title:'Como podemos tornar sua próxima experiência com a Cosmos 3D ainda melhor?',optional:true,help:'Use este espaço para sugestões, comentários ou qualquer ponto que considere importante.'}
];
let step=-1;const data={};const app=document.getElementById('app'),bar=document.getElementById('bar'),pt=document.getElementById('progressText');
function render(){window.scrollTo({top:0,behavior:'smooth'});if(step<0){pt.textContent='';bar.style.width='0';app.innerHTML=`<div class="kicker">Pesquisa de satisfação</div><h1>Sua experiência ajuda a <span class="accent">construir o próximo passo.</span></h1><div class="introline"></div><p class="lead">Na Cosmos 3D, tecnologia, precisão e melhoria contínua fazem parte de cada projeto. Queremos entender sua experiência para evoluir nossos processos e entregar cada vez melhor.</p><p class="meta">Tempo estimado: cerca de 1 minuto.</p><div class="actions"><span></span><button class="btn" onclick="next()">Iniciar pesquisa →</button></div>`;return}
if(step>=questions.length){pt.textContent='Concluído';bar.style.width='100%';app.innerHTML=`<div class="success"><div class="check">✓</div><div class="kicker">Avaliação concluída</div><h2>Obrigado por construir essa evolução com a gente.</h2><p class="lead">Sua percepção nos ajuda a aprimorar processos, elevar a qualidade e tornar cada experiência com a Cosmos 3D ainda melhor.</p></div>`;return}
const q=questions[step];pt.textContent=`${String(step+1).padStart(2,'0')} / ${String(questions.length).padStart(2,'0')}`;bar.style.width=`${((step+1)/questions.length)*100}%`;let body='';
if(q.type==='text')body=`<input id="field" type="text" placeholder="Nome do projeto ou obra" value="${data[q.key]||''}" autofocus><div id="error"></div>`;
if(q.type==='comment')body=`<p class="lead" style="font-size:15px;margin-top:14px">${q.help}</p><textarea id="field" placeholder="Escreva aqui...">${data[q.key]||''}</textarea>`;
if(q.type==='scale'||q.type==='nps'){let start=q.type==='nps'?0:1,end=10;body=`<div class="scale ${q.type==='nps'?'nps':''}">${Array.from({length:end-start+1},(_,i)=>i+start).map(n=>`<button class="score ${data[q.key]===n?'selected':''}" onclick="pick(${n})">${n}</button>`).join('')}</div><div class="anchors"><span>${q.anchors?q.anchors[0]:'Péssimo'}</span><span>${q.anchors?q.anchors[1]:'Excelente'}</span></div>${q.na?`<div class="na"><button class="${data[q.key]==='N/A'?'selected':''}" onclick="pickNA()">Não se aplica</button></div>`:''}`}
app.innerHTML=`<div class="kicker">${q.optional?'Comentário opcional':'Sua avaliação'}</div><h2>${q.title}</h2>${body}<div class="actions"><button class="btn back" onclick="back()">← Voltar</button><button class="btn" onclick="next()">${step===questions.length-1?'Enviar avaliação →':'Continuar →'}</button></div>`}
function pick(v){data[questions[step].key]=v;render();setTimeout(next,170)}function pickNA(){data[questions[step].key]='N/A';render();setTimeout(next,170)}
function next(){if(step>=0&&step<questions.length){const q=questions[step],f=document.getElementById('field');if(f)data[q.key]=f.value.trim();if(!q.optional&&(data[q.key]===undefined||data[q.key]==='')){const e=document.getElementById('error');if(e)e.innerHTML='<div class="error">Preencha este campo para continuar.</div>';if(f)f.focus();return}}step++;render()}function back(){if(step>-1)step--;render()}render();
</script></body></html>
