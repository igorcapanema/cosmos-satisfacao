<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pesquisa de Satisfação | Cosmos 3D</title><style>:root{--blue:#3e8fe8;--ink:#292d30;--muted:#777b7f;--line:#e3e5e6;--bg:#f7f7f6;--white:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}body{min-height:100dvh}.page{width:min(100%,640px);min-height:100dvh;margin:auto;background:var(--white);display:flex;flex-direction:column}.head{padding:24px 22px 14px;border-bottom:1px solid #f0f0ef}.logo{display:block;width:min(270px,72vw);height:auto;margin:0 auto 20px}.logoFallback{text-align:center;font-weight:900;font-size:24px;letter-spacing:.16em;margin-bottom:20px}.logoFallback span{color:var(--blue)}.status{display:flex;align-items:center;gap:14px}.track{height:3px;background:#eceeed;flex:1;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:var(--blue);transition:.3s}.progress{font-size:12px;color:var(--muted);white-space:nowrap}.main{flex:1;padding:42px 22px 34px;display:flex;align-items:flex-start}.card{width:100%}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:16px}h1,h2{margin:0;letter-spacing:-.035em}h1{font-size:clamp(34px,10vw,48px);line-height:1.02}h2{font-size:clamp(27px,7.7vw,38px);line-height:1.1}.lead{color:var(--muted);font-size:16px;line-height:1.6;margin:20px 0 0;max-width:520px}.meta{font-size:12px;color:#999;margin-top:18px}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:36px}.btn{border:0;border-radius:8px;background:var(--ink);color:#fff;padding:15px 20px;font-size:15px;font-weight:700;cursor:pointer;min-height:50px}.primary{background:var(--blue)}.back{background:transparent;color:var(--muted);padding-left:0;min-width:auto}input[type=text],textarea{width:100%;font:inherit;font-size:18px;border:1px solid var(--line);border-radius:8px;padding:16px;outline:0;background:#fff;margin-top:26px}input:focus,textarea:focus{border-color:var(--blue)}textarea{min-height:150px;resize:vertical}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:30px}.score{height:54px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}.score.selected{background:var(--blue);border-color:var(--blue);color:#fff}.anchors{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:10px}.na{margin-top:20px}.na button{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;color:var(--muted);font-weight:600}.na button.selected{border-color:var(--blue);color:var(--blue)}.check{width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:22px}.error{color:#a33;font-size:12px;margin-top:9px}@media(min-width:641px){body{padding:28px}.page{min-height:calc(100dvh - 56px);border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:30px 42px 16px}.main{padding:54px 42px}.scale{grid-template-columns:repeat(10,1fr)}.scale.nps{grid-template-columns:repeat(11,1fr)}.score{height:52px}}</style></head><body><div class="page"><header class="head"><img class="logo" id="logo" alt="Cosmos 3D" src="https://cosmos3d.tech/wp-content/uploads/2024/05/logo-cosmos.png" onerror="this.style.display='none';document.getElementById('fallback').style.display='block'"><div id="fallback" class="logoFallback" style="display:none">COSMOS <span>3D</span></div><div class="status"><div class="track"><div class="bar" id="bar"></div></div><div class="progress" id="progress"></div></div></header><main class="main"><section class="card" id="app"></section></main></div><script>const qs=[{k:'projeto',t:'text',q:'Qual projeto ou obra você realizou com a Cosmos 3D?'},{k:'atendimento',t:'scale',q:'Como você avalia o atendimento e a disponibilidade da nossa equipe?'},{k:'comunicacao',t:'scale',q:'Como você avalia a clareza e a agilidade da nossa comunicação?'},{k:'prazos',t:'scale',q:'Como você avalia o cumprimento dos prazos e compromissos acordados?',na:1},{k:'qualidade',t:'scale',q:'Como você avalia a qualidade dos serviços executados pela Cosmos 3D?',na:1},{k:'resultado',t:'scale',q:'O resultado entregue pela Cosmos 3D atendeu ao que foi contratado e às suas expectativas?',na:1,a:['Não atendeu','Superou as expectativas']},{k:'satisfacao',t:'scale',q:'De modo geral, qual é o seu nível de satisfação com a Cosmos 3D?',a:['Muito insatisfeito','Muito satisfeito']},{k:'nps',t:'nps',q:'De 0 a 10, qual a probabilidade de você recomendar a Cosmos 3D para outra pessoa ou empresa?',a:['Nada provável','Extremamente provável']},{k:'comentario',t:'comment',q:'Como podemos tornar sua próxima experiência com a Cosmos 3D ainda melhor?',opt:1}];let step=-1,d={};const app=document.getElementById('app'),bar=document.getElementById('bar'),pg=document.getElementById('progress');function render(){scrollTo(0,0);if(step<0){bar.style.width='0';pg.textContent='';app.innerHTML='<div class="eyebrow">Pesquisa de satisfação</div><h1>Sua experiência nos ajuda a evoluir.</h1><p class="lead">Queremos entender sua experiência com a Cosmos 3D para aprimorar continuamente nossos processos, serviços e entregas.</p><p class="meta">Leva cerca de 1 minuto.</p><div class="actions"><span></span><button class="btn primary" onclick="next()">Começar →</button></div>';return}if(step>=qs.length){bar.style.width='100%';pg.textContent='Concluído';app.innerHTML='<div class="check">✓</div><div class="eyebrow">Pesquisa concluída</div><h2>Obrigado pela sua avaliação.</h2><p class="lead">Sua opinião contribui diretamente para a melhoria contínua da Cosmos 3D.</p>';return}let x=qs[step];pg.textContent=(step+1)+' de '+qs.length;bar.style.width=((step+1)/qs.length*100)+'%';let body='';if(x.t==='text')body='<input id="field" type="text" placeholder="Nome do projeto ou obra" value="'+(d[x.k]||'')+'"><div id="err"></div>';if(x.t==='comment')body='<p class="lead">Se quiser, deixe uma sugestão, comentário ou ponto que considere importante.</p><textarea id="field" placeholder="Escreva aqui...">'+(d[x.k]||'')+'</textarea>';if(x.t==='scale'||x.t==='nps'){let s=x.t==='nps'?0:1;body='<div class="scale '+(x.t==='nps'?'nps':'')+'>'+Array.from({length:11-s},(_,i)=>i+s).map(n=>'<button class="score '+(d[x.k]===n?'selected':'')+'" onclick="pick('+n+')">'+n+'</button>').join('')+'</div><div class="anchors"><span>'+(x.a?x.a[0]:'Péssimo')+'</span><span>'+(x.a?x.a[1]:'Excelente')+'</span></div>'+(x.na?'<div class="na"><button class="'+(d[x.k]==='N/A'?'selected':'')+'" onclick="pickNA()">Não se aplica</button></div>':'')}app.innerHTML='<div class="eyebrow">'+(x.opt?'Comentário opcional':'Sua avaliação')+'</div><h2>'+x.q+'</h2>'+body+'<div class="actions"><button class="btn back" onclick="back()">← Voltar</button><button class="btn primary" onclick="next()">'+(step===qs.length-1?'Enviar avaliação':'Continuar →')+'</button></div>'}function pick(v){d[qs[step].k]=v;render();setTimeout(next,160)}function pickNA(){d[qs[step].k]='N/A';render();setTimeout(next,160)}function next(){if(step>=0&&step<qs.length){let x=qs[step],f=document.getElementById('field');if(f)d[x.k]=f.value.trim();if(!x.opt&&(d[x.k]===undefined||d[x.k]==='')){let e=document.getElementById('err');if(e)e.innerHTML='<div class="error">Preencha este campo para continuar.</div>';if(f)f.focus();return}}step++;render()}function back(){if(step>-1)step--;render()}render();</script></body></html>
