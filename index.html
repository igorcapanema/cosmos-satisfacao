<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pesquisa de Satisfação | Cosmos 3D</title><style>:root{--blue:#4b91e8;--ink:#303437;--muted:#777b7f;--line:#e3e5e6;--bg:#f4f4f3;--white:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}body{min-height:100dvh}.page{width:min(100%,620px);min-height:100dvh;margin:auto;background:var(--white);display:flex;flex-direction:column}.head{padding:20px 20px 13px;border-bottom:1px solid #efefee}.logo{display:block;width:min(310px,78vw);height:auto;margin:0 auto 18px}.status{display:flex;align-items:center;gap:13px}.track{height:3px;background:#eceeed;flex:1;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:var(--blue);transition:.3s}.progress{font-size:12px;color:var(--muted);white-space:nowrap}.main{flex:1;padding:38px 20px 32px;display:flex;align-items:flex-start}.card{width:100%}.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:15px}h1,h2{margin:0;letter-spacing:-.035em}h1{font-size:clamp(34px,10vw,46px);line-height:1.03}h2{font-size:clamp(27px,7.6vw,37px);line-height:1.1}.lead{color:var(--muted);font-size:16px;line-height:1.55;margin:19px 0 0;max-width:520px}.meta{font-size:12px;color:#999;margin-top:17px}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:34px}.btn{border:0;border-radius:7px;background:var(--ink);color:#fff;padding:15px 19px;font-size:15px;font-weight:700;cursor:pointer;min-height:50px}.primary{background:var(--blue)}.back{background:transparent;color:var(--muted);padding-left:0;min-width:auto}input[type=text],textarea{width:100%;font:inherit;font-size:18px;border:1px solid var(--line);border-radius:7px;padding:16px;outline:0;background:#fff;margin-top:25px}input:focus,textarea:focus{border-color:var(--blue)}textarea{min-height:145px;resize:vertical}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:29px}.score{height:54px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}.score.selected{background:var(--blue);border-color:var(--blue);color:#fff}.anchors{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:10px}.na{margin-top:19px}.na button{width:100%;background:#fff;border:1px solid var(--line);border-radius:7px;padding:14px;color:var(--muted);font-weight:600}.na button.selected{border-color:var(--blue);color:var(--blue)}.check{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:23px;margin-bottom:21px}.error{color:#a33;font-size:12px;margin-top:9px}@media(min-width:641px){body{padding:28px}.page{min-height:calc(100dvh - 56px);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:27px 40px 15px}.main{padding:50px 40px}.scale{grid-template-columns:repeat(10,1fr)}.scale.nps{grid-template-columns:repeat(11,1fr)}.score{height:52px}}</style></head><body><div class="page"><header class="head"><img class="logo" alt="Cosmos 3D — Concrete 3D printer for a new way of building" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0
